[project]
name = "crickai-api"
version = "0.1.0"
description = "FastAPI backend skeleton for the CrickAI training net application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "celery>=5.4.0",
    "fastapi>=0.115.0",
    "loguru>=0.7.2",
    "moviepy>=1.0.3",
    "numpy>=2.1.0",
    "opencv-python-headless>=4.10.0.84",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "python-multipart>=0.0.9",
    "python-jose>=3.3.0",
    "redis>=5.0.8",
    "scipy>=1.13",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.30.6",
]

[project.optional-dependencies]
bat-contact = [
    "librosa>=0.10",
]
ml-base = [
    "mediapipe>=0.10.14",
    "onnxruntime>=1.19.2",
    "tensorflow>=2.21.0",
    "torch>=2.4.1",
]
ml-base-cpu = [
    "onnxruntime>=1.19.2",
]
ml-base-gpu = [
    "onnxruntime-gpu>=1.19.2",
]
bowler-performance = [
    "filterpy>=1.4.5",
    "pykalman>=0.9.7",
    "scipy>=1.14.1",
]
action-legality = [
    "pose-format>=0.4.0",
    "trimesh>=4.4.9",
]
shot-classifier = [
    "google-generativeai>=0.3.0",
    "joblib>=1.4.2",
    "scikit-learn>=1.5.2",
]
shot-similarity = [
    "annoy>=1.17.3",
    "faiss-cpu>=1.9.0; python_version >= '3.11'",
    "faiss-cpu>=1.9.0; platform_system == 'Windows'",
    "faiss-gpu>=1.7.2; python_version < '3.11' and platform_system != 'Windows'",
]
dev = [
    "aiosqlite>=0.20.0",
    "factory-boy>=3.3.1",
    "httpx>=0.27.2",
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/.python-version",
    "/.gitignore",
    "/Dockerfile",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
pretty = true
show_error_codes = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "pyrender>=0.1.45",
    "trimesh>=4.11.4",
]
